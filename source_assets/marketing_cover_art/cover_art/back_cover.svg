<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="1650" viewBox="0 0 1030 1650">
<title>Editable back cover insert</title>
<rect width="100%" height="100%" fill="#fbfbf8"/>
<g font-family="DejaVu Sans Mono, monospace" fill="#27292c" font-size="88"><text x="47" y="118">Your back</text><text x="47" y="224">cover art</text><text x="47" y="330">goes here.</text></g><text x="52" y="410" font-family="Noto Sans, sans-serif" font-size="26" fill="#717578" >Make room for your next great adventure.</text><rect x="40" y="1072" width="195" height="55" fill="#292b2d"/><rect x="40" y="1127" width="195" height="39" fill="white" stroke="#949698" stroke-width="2"/><rect x="239" y="1072" width="185" height="55" fill="#292b2d"/><rect x="239" y="1127" width="185" height="39" fill="white" stroke="#949698" stroke-width="2"/><rect x="428" y="1072" width="185" height="55" fill="#292b2d"/><rect x="428" y="1127" width="185" height="39" fill="white" stroke="#949698" stroke-width="2"/><rect x="617" y="1072" width="373" height="55" fill="#292b2d"/><rect x="617" y="1127" width="373" height="39" fill="white" stroke="#949698" stroke-width="2"/><text x="137" y="1108" font-family="Noto Sans, sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="700">PLAY MODE</text><text x="137" y="1153" font-family="Noto Sans, sans-serif" font-size="19" fill="#202126" text-anchor="middle">PLAYERS</text><g fill="none" stroke="white" stroke-width="4"><rect x="298" y="1083" width="64" height="30" rx="2"/><path d="M330 1113 V1119 M310 1119 H350"/><rect x="491" y="1085" width="58" height="29" rx="2"/><path d="M539 1115 L550 1120"/><rect x="714" y="1085" width="66" height="29" rx="3"/><path d="M727 1085 V1114 M767 1085 V1114"/></g><text x="331" y="1153" font-family="Noto Sans, sans-serif" font-size="23" fill="#202126" text-anchor="middle">1–4</text><text x="520" y="1153" font-family="Noto Sans, sans-serif" font-size="23" fill="#202126" text-anchor="middle">1–2</text><text x="747" y="1153" font-family="Noto Sans, sans-serif" font-size="23" fill="#202126" text-anchor="middle">1</text><text x="878" y="1108" font-family="Noto Sans, sans-serif" font-size="19" fill="white" text-anchor="middle">HANDHELD</text><rect x="40" y="1186" width="950" height="81" fill="#fff5f4" stroke="#cb8a8b" stroke-width="2"/><path d="M69 1201 L91 1246 H47 Z" fill="#e60012"/><text x="69" y="1237" font-family="Noto Sans, sans-serif" font-size="31" fill="white" text-anchor="middle" font-weight="800">!</text><text x="110" y="1214" font-family="Noto Sans, sans-serif" font-size="19" fill="#e60012" font-weight="700">IMPORTANT INFORMATION</text><text x="110" y="1244" font-family="Noto Sans, sans-serif" font-size="20" fill="#8d686b" >Replace this area with the game’s notices and compatibility details.</text><rect x="40" y="1285" width="950" height="140" fill="none" stroke="#aeb0b1" stroke-width="2"/><text x="56" y="1316" font-family="Noto Sans, sans-serif" font-size="21" fill="#5a5e61" >Add your game description, publisher details and required notices here.</text><text x="56" y="1344" font-family="Noto Sans, sans-serif" font-size="21" fill="#5a5e61" >This is an editable cover-art mockup. Artwork, product information,</text><text x="56" y="1372" font-family="Noto Sans, sans-serif" font-size="21" fill="#5a5e61" >player counts and rating shown are placeholders for your design.</text><text x="56" y="1400" font-family="Noto Sans, sans-serif" font-size="21" fill="#5a5e61" >Front, back and spine artwork can be replaced independently.</text><g transform="translate(43 1445) scale(0.98)">
      <rect width="128" height="164" fill="white" stroke="#202126" stroke-width="5"/>
      <rect x="4" y="4" width="120" height="26" fill="#202126"/>
      <text x="64" y="23" font-family="Noto Sans, sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="700">RATING PENDING</text>
      <text x="64" y="113" font-family="Noto Sans, sans-serif" font-size="76" fill="#202126" text-anchor="middle" font-weight="900" letter-spacing="-7">RP</text>
      <path d="M4 130 L124 130" fill="none" stroke="#202126" stroke-width="2"/>
      <text x="64" y="151" font-family="Noto Sans, sans-serif" font-size="12" fill="#202126" text-anchor="middle" font-weight="700">PLACEHOLDER</text>
    </g><text x="189" y="1481" font-family="Noto Sans, sans-serif" font-size="20" fill="#202126" font-weight="700">RATING</text><text x="189" y="1511" font-family="Noto Sans, sans-serif" font-size="20" fill="#202126" font-weight="700">PENDING</text><text x="189" y="1545" font-family="Noto Sans, sans-serif" font-size="20" fill="#77797c" >Your content</text><text x="189" y="1573" font-family="Noto Sans, sans-serif" font-size="20" fill="#77797c" >descriptors here</text><rect x="503" y="1447" width="184" height="158" fill="none" stroke="#aeb0b1" stroke-width="2"/><text x="595" y="1480" font-family="Noto Sans, sans-serif" font-size="20" fill="#202126" text-anchor="middle" font-weight="700">YOUR STUDIO</text><text x="595" y="1514" font-family="Noto Sans, sans-serif" font-size="22" fill="#878a8c" text-anchor="middle">LOGO</text><text x="595" y="1580" font-family="Noto Sans, sans-serif" font-size="16" fill="#77797c" text-anchor="middle">HAC-P-00000</text><rect x="706" y="1447" width="284" height="158" fill="white" stroke="#aeb0b1" stroke-width="2"/><rect x="727" y="1464" width="3" height="104" fill="#25272a"/><rect x="732" y="1464" width="4" height="104" fill="#25272a"/><rect x="740" y="1464" width="2" height="104" fill="#25272a"/><rect x="744" y="1464" width="6" height="104" fill="#25272a"/><rect x="752" y="1464" width="3" height="104" fill="#25272a"/><rect x="759" y="1464" width="2" height="104" fill="#25272a"/><rect x="765" y="1464" width="2" height="104" fill="#25272a"/><rect x="769" y="1464" width="2" height="104" fill="#25272a"/><rect x="774" y="1464" width="4" height="104" fill="#25272a"/><rect x="780" y="1464" width="2" height="104" fill="#25272a"/><rect x="784" y="1464" width="6" height="104" fill="#25272a"/><rect x="793" y="1464" width="2" height="104" fill="#25272a"/><rect x="799" y="1464" width="2" height="104" fill="#25272a"/><rect x="803" y="1464" width="6" height="104" fill="#25272a"/><rect x="811" y="1464" width="6" height="104" fill="#25272a"/><rect x="821"